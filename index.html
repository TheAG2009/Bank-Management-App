<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Bank Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-overlay" class="overlay">
        <div class="card login-card">
            <h2>Secure Login</h2>
            <input type="text" id="loginUser" placeholder="Username">
            <input type="password" id="loginPass" placeholder="Password">
            <button onclick="auth.login()">Sign In</button>
            <p>Demo: admin / 1234</p>
        </div>
    </div>

    <!-- Main Application (Hidden by default) -->
    <div id="main-app" class="app-container" style="display:none;">
        <header class="main-header">
            <div class="profile-section">
                <img id="userPic" src="https://via.placeholder.com/50" alt="Profile">
                <span id="welcomeMsg">Welcome, User</span>
            </div>
            <button class="logout-btn" onclick="auth.logout()">Logout</button>
        </header>

        <div class="dashboard">
            <!-- Account Management -->
            <div class="card">
                <h3>Add New Customer</h3>
                <input type="text" id="accName" placeholder="Full Name">
                <input type="number" id="initialDeposit" placeholder="Initial Balance ($)">
                <label for="profileInput" class="file-label">Upload Profile Photo</label>
                <input type="file" id="profileInput" accept="image/*">
                <button onclick="bankApp.createAccount()">Register Account</button>
            </div>

            <!-- Global Transaction -->
            <div class="card">
                <h3>Quick Transaction</h3>
                <input type="number" id="targetId" placeholder="Account ID">
                <input type="number" id="transAmount" placeholder="Amount ($)">
                <div class="action-buttons">
                    <button class="btn-deposit" onclick="bankApp.handleTransaction('deposit')">Deposit</button>
                    <button class="btn-withdraw" onclick="bankApp.handleTransaction('withdraw')">Withdraw</button>
                </div>
            </div>
        </div>

        <!-- Records Table -->
        <div class="card">
            <h3>System Database</h3>
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Balance</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="recordBody"></tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
