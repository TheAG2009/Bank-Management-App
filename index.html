<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Bank Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bank Management System</h1>
        
        <!-- Account Creation Section -->
        <section id="creation-section">
            <h3>Create New Account</h3>
            <input type="text" id="userName" placeholder="Account Holder Name">
            <input type="number" id="initialDeposit" placeholder="Initial Deposit ($)">
            <button onclick="createAccount()">Open Account</button>
        </section>

        <hr>

        <!-- Transaction Section -->
        <section id="transaction-section">
            <h3>Transactions</h3>
            <input type="number" id="targetAccount" placeholder="Account ID">
            <input type="number" id="amount" placeholder="Amount ($)">
            <div class="btn-group">
                <button class="dep-btn" onclick="handleTransaction('deposit')">Deposit</button>
                <button class="draw-btn" onclick="handleTransaction('withdraw')">Withdraw</button>
            </div>
        </section>

        <hr>

        <!-- Data Display Section -->
        <section id="display-section">
            <h3>Customer Records</h3>
            <table id="accountTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Balance</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="accountData">
                    <!-- Data will be injected here by script.js -->
                </tbody>
            </table>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
