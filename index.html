<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Bank | Secure Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Auth Shield -->
    <div id="auth-screen" class="overlay">
        <div class="glass-card fade-in">
            <i class="fas fa-fingerprint fa-4x pulse"></i>
            <h2>System Authentication</h2>
            <div class="input-box">
                <input type="text" id="user" placeholder="Username" required>
                <input type="password" id="pass" placeholder="Access Code" required>
            </div>
            <button class="prime-btn" onclick="UI.attemptLogin()">Initialize Session</button>
            <p class="hint">Default: admin / 1234</p>
        </div>
    </div>

    <!-- Main Banking OS -->
    <div id="app-shell" class="hidden">
        <nav class="top-nav">
            <div class="brand">QUANTUM<span>VAULT</span></div>
            <div class="user-info">
                <span id="session-user">Admin</span>
                <button onclick="location.reload()" class="exit-btn"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </nav>

        <div class="main-layout">
            <aside class="controls">
                <div class="card">
                    <h3><i class="fas fa-user-plus"></i> New Client</h3>
                    <div class="photo-zone">
                        <img id="prev" src="https://ui-avatars.com/api/?name=User&background=random" alt="Profile">
                        <input type="file" id="photo-input" hidden accept="image/*">
                        <button onclick="document.getElementById('photo-input').click()">Upload Photo</button>
                    </div>
                    <input type="text" id="new-name" placeholder="Client Name">
                    <input type="number" id="new-bal" placeholder="Opening Balance ($)">
                    <button class="action-btn" onclick="Core.register()">Confirm Registry</button>
                </div>

                <div class="card">
                    <h3><i class="fas fa-cash-register"></i> Terminal</h3>
                    <input type="number" id="target-id" placeholder="Account ID">
                    <input type="number" id="amount" placeholder="Amount">
                    <div class="btn-row">
                        <button class="dep-btn" onclick="Core.transact('deposit')">Deposit</button>
                        <button class="wd-btn" onclick="Core.transact('withdraw')">Withdraw</button>
                    </div>
                </div>
            </aside>

            <section class="display-area">
                <div class="stats-grid">
                    <div class="stat-card">
                        <small>Total Assets</small>
                        <h2 id="total-assets">$0.00</h2>
                    </div>
                    <div class="stat-card">
                        <small>Active Clients</small>
                        <h2 id="client-count">0</h2>
                    </div>
                </div>

                <div class="table-container card">
                    <table>
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>ID</th>
                                <th>Balance</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="client-rows"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
