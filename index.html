<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>🏦 Bank Management System</h1>
        
        <!-- Create Account Form -->
        <div class="card">
            <h3>Create New Account</h3>
            <div class="input-group">
                <input type="text" id="accName" placeholder="Full Name">
                <input type="number" id="initialDeposit" placeholder="Initial Deposit ($)">
                <button onclick="bankApp.createAccount()">Open Account</button>
            </div>
        </div>

        <!-- Transactions Section -->
        <div class="card">
            <h3>Transactions</h3>
            <div class="input-group">
                <input type="number" id="targetId" placeholder="Account ID">
                <input type="number" id="transAmount" placeholder="Amount ($)">
                <div class="action-buttons">
                    <button class="btn-deposit" onclick="bankApp.handleTransaction('deposit')">Deposit</button>
                    <button class="btn-withdraw" onclick="bankApp.handleTransaction('withdraw')">Withdraw</button>
                </div>
            </div>
        </div>

        <!-- Records Table -->
        <div class="card">
            <h3>Customer Records</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Balance</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="recordBody"></tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
