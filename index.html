<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBI Bank | Central Banking Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <!-- Auth Shield -->
    <div id="auth-screen" class="overlay">
        <div class="glass-card fade-in">
            <i class="fas fa-building-columns fa-4x pulse"></i>
            <h2>CBI Secure Portal</h2>
            <div class="input-box">
                <input type="text" id="user" placeholder="Staff ID">
                <input type="password" id="pass" placeholder="Secure Pin">
            </div>
            <button class="prime-btn" onclick="UI.attemptLogin()">Initialize Session</button>
            <p class="credit-text">System Engineered by AG</p>
        </div>
    </div>

    <!-- Main Banking OS -->
    <div id="app-shell" class="hidden">
        <nav class="top-nav">
            <div class="brand">CBI<span>BANK</span></div>
            <div class="nav-tools">
                <button onclick="UI.toggleTheme()" class="tool-btn" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-profile">
                    <span>Admin Session</span>
                    <button onclick="location.reload()" class="exit-btn"><i class="fas fa-power-off"></i></button>
                </div>
            </div>
        </nav>

        <div class="main-layout">
            <aside class="controls">
                <!-- Registration -->
                <div class="card">
                    <h3><i class="fas fa-user-plus"></i> Open Account</h3>
                    <div class="photo-zone">
                        <img id="prev" src="https://ui-avatars.com/api/?name=CBI&background=003366&color=fff" alt="Profile">
                        <input type="file" id="photo-input" hidden accept="image/*">
                        <button onclick="document.getElementById('photo-input').click()">Upload Portrait</button>
                    </div>
                    <input type="text" id="new-name" placeholder="Full Name">
                    <input type="number" id="new-bal" placeholder="Opening Balance ($)">
                    <button class="action-btn" onclick="Core.register()">Verify & Open</button>
                </div>

                <!-- Terminal -->
                <div class="card">
                    <h3><i class="fas fa-cash-register"></i> CBI Terminal</h3>
                    <input type="number" id="target-id" placeholder="Account ID">
                    <input type="number" id="amount" placeholder="Amount ($)">
                    <div class="btn-row">
                        <button class="dep-btn" onclick="Core.transact('deposit')">Deposit</button>
                        <button class="wd-btn" onclick="Core.transact('withdraw')">Withdraw</button>
                    </div>
                </div>
            </aside>

            <section class="display-area">
                <div class="stats-grid">
                    <div class="stat-card">
                        <small>Total Net Assets</small>
                        <h2 id="total-assets">$0.00</h2>
                    </div>
                    <div class="stat-card">
                        <small>Verified Clients</small>
                        <h2 id="client-count">0</h2>
                    </div>
                </div>

                <!-- Database Tools -->
                <div class="table-container card">
                    <div class="table-header">
                        <h3><i class="fas fa-database"></i> Live Database</h3>
                        <input type="text" id="searchBar" onkeyup="UI.filterTable()" placeholder="Search by name or ID...">
                    </div>
                    <div class="scroll-box">
                        <table>
                            <thead>
                                <tr>
                                    <th>Client</th>
                                    <th>Account ID</th>
                                    <th>Balance</th>
                                    <th>Tools</th>
                                </tr>
                            </thead>
                            <tbody id="client-rows"></tbody>
                        </table>
                    </div>
                </div>
                <footer class="system-footer">
                    <p>&copy; 2026 CBI Bank Digital Interface | <strong>Developed by AG</strong></p>
                </footer>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
